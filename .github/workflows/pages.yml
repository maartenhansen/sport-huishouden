# Publiceert de app naar GitHub Pages bij elke push naar main.
# Hetzelfde bestand staat in de live-repository (sport-huishouden) en in de
# dev-repository (sport-huishouden-dev); het eigen domein staat per repository
# in Settings → Pages, dus er is geen CNAME-bestand nodig.
name: Publiceren naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Website samenstellen (alleen de app-bestanden)
        run: |
          mkdir _site
          cp index.html styles.css app.js sync.js config.js version.js sw.js \
             manifest.webmanifest manifest-dev.webmanifest _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

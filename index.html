<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <!-- Beveiliging: de pagina mag alleen eigen scripts laden en alleen met je eigen Supabase-project praten -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cyvuznstxbqjlflyjrgd.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Sport & Huishouden</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1 id="title">Vandaag</h1>
      <div id="subtitle" class="sub"></div>
      <span id="syncBadge" class="sync-badge" hidden></span>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-view="vandaag"><span>📅</span>Vandaag</button>
    <button data-view="sport"><span>🏃</span>Sport</button>
    <button data-view="huishouden"><span>🧹</span>Huishouden</button>
    <button data-view="geschiedenis"><span>📊</span>Geschiedenis</button>
  </nav>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
